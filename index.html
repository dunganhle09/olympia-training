<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trí Tuệ Thiên Thanh - Đang bảo trì</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lexend', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .icon-box {
            font-size: 50px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 12px; font-weight: 700; }
        p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">🛠️</div>
        <h1>Đang Bảo Trì Hệ Thống</h1>
        <p>Hệ thống <strong>Trí Tuệ Thiên Thanh</strong> đang được cập nhật bộ câu hỏi mới và nâng cấp tính năng. Mời bạn quay lại sau ít phút nhé!</p>
        <div class="badge">⏱️ Dự kiến hoàn tất sớm</div>
    </div>
</body>
</html>
